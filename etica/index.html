<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ontología de Ética Institucional</title>

  <script src="https://cdn.jsdelivr.net/npm/rdflib@2.2.36/dist/rdflib.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f8fa;
      color: #222;
    }

    header {
      background: white;
      border-bottom: 1px solid #ddd;
      padding: 22px 30px;
    }

    header h1 {
      margin: 0 0 6px 0;
      font-size: 26px;
    }

    header p {
      margin: 0;
      color: #666;
    }

    #container {
      display: flex;
      height: calc(100vh - 95px);
    }

    #graph {
      flex: 1;
      background: white;
      min-width: 0;
      overflow: hidden;
    }

    #graph svg {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    #panel {
      width: 320px;
      padding: 24px;
      background: #fafafa;
      border-left: 1px solid #ddd;
      overflow-y: auto;
    }

    #panel h2 {
      margin-top: 0;
    }

    .label {
      font-weight: bold;
      margin-top: 18px;
    }

    .node circle,
    .node rect,
    .node polygon {
      cursor: grab;
    }

    .node circle:active,
    .node rect:active,
    .node polygon:active {
      cursor: grabbing;
    }

    .node text {
      font-size: 13px;
      pointer-events: none;
      fill: #222;
    }

    .link {
      stroke: #aaa;
      stroke-width: 1.4px;
    }

    .related {
      stroke: #bbb;
      stroke-width: 1px;
      stroke-dasharray: 5, 5;
    }

    #status {
      padding: 30px;
      font-size: 16px;
    }

    @media (max-width: 700px) {

      header {
        padding: 16px 18px;
      }

      header h1 {
        font-size: 21px;
      }

      header p {
        font-size: 13px;
      }

      #container {
        flex-direction: column;
        height: auto;
      }

      #graph {
        width: 100%;
        height: 70vh;
        min-height: 480px;
      }

      #panel {
        width: 100%;
        border-left: none;
        border-top: 1px solid #ddd;
        padding: 20px;
        overflow-y: visible;
      }

      .node text {
        font-size: 12px;
      }
    }

  </style>
</head>

<body>

<header>
  <h1>Ontología de Ética Institucional</h1>
  <p>Visualización SKOS — Mariano Mosquera</p>
</header>

<div id="container">

  <div id="graph">
    <div id="status">Cargando ontologías...</div>
  </div>

  <aside id="panel">
    <h2>Concepto</h2>
    <p>
      Selecciona un concepto del grafo para consultar su información.
    </p>
  </aside>

</div>


<script>

/* =========================================================
   CONFIGURACIÓN DE TTL
   ========================================================= */

const ttlURLs = [

  "./etica.ttl",

  "../valores.ttl",

  "../institucional.ttl",
  "../politica.ttl",
  "../social.ttl",
  "../ambiental.ttl",
  "../economica.ttl",
  "../tecnologica.ttl",

  "../racionalidad.ttl",

  "../compliance.ttl",
  "../engagement.ttl",
  "../accountability.ttl"

];


const RDF_TYPE =
  "http://www.w3.org/1999/02/22-rdf-syntax-ns#type";


const SKOS = {

  Concept:
    "http://www.w3.org/2004/02/skos/core#Concept",

  prefLabel:
    "http://www.w3.org/2004/02/skos/core#prefLabel",

  altLabel:
    "http://www.w3.org/2004/02/skos/core#altLabel",

  broader:
    "http://www.w3.org/2004/02/skos/core#broader",

  narrower:
    "http://www.w3.org/2004/02/skos/core#narrower",

  related:
    "http://www.w3.org/2004/02/skos/core#related",

  definition:
    "http://www.w3.org/2004/02/skos/core#definition"

};


/* =========================================================
   CARGA DE TODOS LOS TTL
   ========================================================= */

Promise.all(

  ttlURLs.map(url =>

    fetch(url)

      .then(response => {

        if (!response.ok) {
          throw new Error(
            "No se pudo cargar " + url
          );
        }

        return response.text();

      })

      .then(ttl => ({
        url: url,
        ttl: ttl
      }))

  )

)

.then(files => {


  const store =
    $rdf.graph();


  files.forEach(file => {

    const baseURI =
      new URL(
        file.url,
        window.location.href
      ).href;

    $rdf.parse(
      file.ttl,
      store,
      baseURI,
      "text/turtle"
    );

  });


  const status =
    document.getElementById("status");

  if (status) {
    status.remove();
  }


  /* =====================================================
     CONCEPTOS SKOS
     ===================================================== */

  const conceptStatements =

    store.match(
      null,
      $rdf.sym(RDF_TYPE),
      $rdf.sym(SKOS.Concept)
    );


  const nodesMap =
    new Map();


  conceptStatements.forEach(statement => {

    const uri =
      statement.subject.value;

    const pref =
      store.any(
        statement.subject,
        $rdf.sym(SKOS.prefLabel)
      );

    nodesMap.set(
      uri,
      {

        id: uri,

        label:
          pref
            ? pref.value
            : uri.split(/[\/#]/).pop(),

        altLabels: [],

        definition: null,

        broader: null,

        related: []

      }
    );

  });


  /* =====================================================
     PROPIEDADES SKOS
     ===================================================== */

  nodesMap.forEach(node => {

    const subject =
      $rdf.sym(node.id);


    /* ALT LABEL */

    const alternatives =
      store.each(
        subject,
        $rdf.sym(SKOS.altLabel)
      );

    node.altLabels =
      alternatives.map(x => x.value);


    /* DEFINITION */

    const definition =
      store.any(
        subject,
        $rdf.sym(SKOS.definition)
      );

    if (definition) {
      node.definition = definition.value;
    }


    /* BROADER */

    const broader =
      store.any(
        subject,
        $rdf.sym(SKOS.broader)
      );

    if (broader) {
      node.broader = broader.value;
    }


    /* RELATED */

    const related =
      store.each(
        subject,
        $rdf.sym(SKOS.related)
      );

    node.related =
      related.map(x => x.value);

  });


  const nodes =
    Array.from(nodesMap.values());


  /* =====================================================
     NORMALIZACIÓN
     ===================================================== */

  function normalizeLabel(text) {

    return text

      .normalize("NFD")

      .replace(
        /[\u0300-\u036f]/g,
        ""
      )

      .trim()

      .toLowerCase();

  }


  function findByLabel(label) {

    const normalized =
      normalizeLabel(label);

    return nodes.find(
      node =>
        normalizeLabel(node.label)
        === normalized
    );

  }


  /* =====================================================
     NODOS ESTRUCTURALES
     ===================================================== */

  const eticaNode =
    findByLabel("Ética institucional");

  const atencionNode =
    findByLabel("Atención");

  const valoresNode =
    findByLabel("Valores");

  const agendaNode =
    findByLabel("Agenda");

  const racionalidadNode =
    findByLabel("Racionalidad");

  const gobernanzaNode =
    findByLabel("Gobernanza");

  const complianceNode =
    findByLabel("Compliance");

  const engagementNode =
    findByLabel("Engagement");

  const accountabilityNode =
    findByLabel("Accountability");


  /* =====================================================
     RAÍCES DE AGENDA
     ===================================================== */

  const institucionalNode =
    findByLabel("Institucional");

  const politicaNode =
    findByLabel("Política");

  const socialNode =
    findByLabel("Social");

  const ambientalNode =
    findByLabel("Ambiental");

  const economicaNode =
    findByLabel("Económica");

  const tecnologicaNode =
    findByLabel("Tecnológica");


  /* =====================================================
     VERIFICACIÓN
     ===================================================== */

  if (!eticaNode) {
    throw new Error(
      'No se encontró el nodo "Ética institucional".'
    );
  }

  if (!atencionNode) {
    throw new Error(
      'No se encontró el nodo "Atención".'
    );
  }

  if (!agendaNode) {
    throw new Error(
      'No se encontró el nodo "Agenda".'
    );
  }

  if (!valoresNode) {
    throw new Error(
      'No se encontró el nodo "Valores".'
    );
  }

  if (!racionalidadNode) {
    throw new Error(
      'No se encontró el nodo "Racionalidad".'
    );
  }

  if (!gobernanzaNode) {
    throw new Error(
      'No se encontró el nodo "Gobernanza".'
    );
  }


  /* =====================================================
     RELACIONES JERÁRQUICAS
     ===================================================== */

  const hierarchyLinks = [];

  const hierarchyKeys =
    new Set();


  function addHierarchy(
    source,
    target
  ) {

    if (
      !source ||
      !target ||
      source === target
    ) {
      return;
    }

    const key =
      source + "|" + target;

    if (
      hierarchyKeys.has(key)
    ) {
      return;
    }

    hierarchyKeys.add(key);

    hierarchyLinks.push({
      source: source,
      target: target
    });

  }


  /* =====================================================
     BROADER EXISTENTES
     ===================================================== */

  nodes.forEach(node => {

    if (
      node.broader &&
      nodesMap.has(node.broader)
    ) {

      addHierarchy(
        node.broader,
        node.id
      );

    }

  });


  /* =====================================================
     NARROWER EXISTENTES
     ===================================================== */

  nodes.forEach(node => {

    const subject =
      $rdf.sym(node.id);

    const narrowers =
      store.each(
        subject,
        $rdf.sym(SKOS.narrower)
      );

    narrowers.forEach(target => {

      if (
        nodesMap.has(target.value)
      ) {

        addHierarchy(
          node.id,
          target.value
        );

      }

    });

  });


  /* =====================================================
     ESTRUCTURA MAESTRA

                       ÉTICA INSTITUCIONAL

             ATENCIÓN    RACIONALIDAD    GOBERNANZA

            /       \                    /    |    \
        VALORES    AGENDA        COMPLIANCE ENGAGEMENT ACCOUNTABILITY

     ===================================================== */


  /* ÉTICA → ATENCIÓN */

  addHierarchy(
    eticaNode.id,
    atencionNode.id
  );

  atencionNode.broader =
    eticaNode.id;


  /* ÉTICA → RACIONALIDAD */

  addHierarchy(
    eticaNode.id,
    racionalidadNode.id
  );

  racionalidadNode.broader =
    eticaNode.id;


  /* ÉTICA → GOBERNANZA */

  addHierarchy(
    eticaNode.id,
    gobernanzaNode.id
  );

  gobernanzaNode.broader =
    eticaNode.id;


  /* =====================================================
     ATENCIÓN
     ===================================================== */

  addHierarchy(
    atencionNode.id,
    valoresNode.id
  );

  valoresNode.broader =
    atencionNode.id;


  addHierarchy(
    atencionNode.id,
    agendaNode.id
  );

  agendaNode.broader =
    atencionNode.id;


  /* =====================================================
     AGENDA
     ===================================================== */

  const agendaRoots = [

    institucionalNode,
    politicaNode,
    socialNode,
    ambientalNode,
    economicaNode,
    tecnologicaNode

  ].filter(Boolean);


  agendaRoots.forEach(root => {

    addHierarchy(
      agendaNode.id,
      root.id
    );

    root.broader =
      agendaNode.id;

  });


  /* =====================================================
     GOBERNANZA
     ===================================================== */

  const governanceRoots = [

    complianceNode,
    engagementNode,
    accountabilityNode

  ].filter(Boolean);


  governanceRoots.forEach(root => {

    addHierarchy(
      gobernanzaNode.id,
      root.id
    );

    root.broader =
      gobernanzaNode.id;

  });


  /* =====================================================
     RELATED
     ===================================================== */

  const relatedLinks = [];

  const relatedKeys =
    new Set();


  nodes.forEach(node => {

    node.related.forEach(target => {

      if (
        !nodesMap.has(target)
      ) {
        return;
      }

      const key =
        [
          node.id,
          target
        ]
        .sort()
        .join("|");

      if (
        relatedKeys.has(key)
      ) {
        return;
      }

      relatedKeys.add(key);

      relatedLinks.push({
        source: node.id,
        target: target
      });

    });

  });


  /* =====================================================
     FUNCIÓN PARA OBTENER DESCENDIENTES

     Permite aplicar una misma forma/color a una categoría
     y a todo lo que deriva jerárquicamente de ella.
     ===================================================== */

  function descendantsOfLabels(labels) {

    const result =
      new Set();

    const normalizedLabels =
      labels.map(normalizeLabel);

    nodes.forEach(node => {

      if (
        normalizedLabels.includes(
          normalizeLabel(node.label)
        )
      ) {

        result.add(node.id);

      }

    });


    let changed = true;

    while (changed) {

      changed = false;

      hierarchyLinks.forEach(link => {

        const sourceID =
          typeof link.source === "object"
            ? link.source.id
            : link.source;

        const targetID =
          typeof link.target === "object"
            ? link.target.id
            : link.target;

        if (
          result.has(sourceID) &&
          !result.has(targetID)
        ) {

          result.add(targetID);
          changed = true;

        }

      });

    }

    return result;

  }


  /* =====================================================
     CATEGORÍAS VISUALES
     ===================================================== */


  /* PROBLEMAS:
     triángulos rojo pastel */

  const problemNodeIDs =
    descendantsOfLabels([
      "Problemas"
    ]);


  /* ACTORES:
     cuadrados azul pastel */

  const actorNodeIDs =
    descendantsOfLabels([
      "Actores"
    ]);


  /*
     TIPO:
     amarillo pastel

     Se consideran Tipo y Tipos.
  */

  const typeNodeIDs =
    descendantsOfLabels([
      "Tipo",
      "Tipos"
    ]);


  /*
     TEMAS:
     verde pastel
  */

  const themeNodeIDs =
    descendantsOfLabels([
      "Temas"
    ]);


  /*
     NORMAS:
     violeta pastel
  */

  const normNodeIDs =
    descendantsOfLabels([
      "Normas"
    ]);


  /*
     EVIDENCIA:
     celeste pastel
  */

  const evidenceNodeIDs =
    descendantsOfLabels([
      "Evidencia"
    ]);


  /*
     CALIDAD:
     turquesa pastel
  */

  const qualityNodeIDs =
    descendantsOfLabels([
      "Calidad"
    ]);


  /*
     RESPONSABILIDAD:
     naranja pastel
  */

  const responsibilityNodeIDs =
    descendantsOfLabels([
      "Responsabilidad"
    ]);


  /*
     TEORÍA:
     lavanda pastel
  */

  const theoryNodeIDs =
    descendantsOfLabels([
      "Teoría"
    ]);


  /*
     TELEOLOGÍA:
     rosa pastel
  */

  const teleologyNodeIDs =
    descendantsOfLabels([
      "Teleología"
    ]);


  /*
     CONTROL:
     verde azulado pastel
  */

  const controlNodeIDs =
    descendantsOfLabels([
      "Control"
    ]);


  /*
     TRANSPARENCIA:
     durazno pastel
  */

  const transparencyNodeIDs =
    descendantsOfLabels([
      "Transparencia"
    ]);


  /*
     ANÁLISIS DE RIESGO:
     beige pastel
  */

  const riskNodeIDs =
    descendantsOfLabels([
      "Análisis de riesgo"
    ]);


  /*
     PLURALIDAD:
     rosa/lila pastel
  */

  const pluralityNodeIDs =
    descendantsOfLabels([
      "Pluralidad"
    ]);


  /*
     CAPACIDAD:
     verde pastel claro
  */

  const capacityNodeIDs =
    descendantsOfLabels([
      "Capacidad"
    ]);


  /* =====================================================
     DIBUJAR
     ===================================================== */

  drawGraph(

    nodes,

    hierarchyLinks,

    relatedLinks,

    nodesMap,

    {

      eticaNode,
      atencionNode,
      valoresNode,
      agendaNode,
      racionalidadNode,
      gobernanzaNode,

      complianceNode,
      engagementNode,
      accountabilityNode,

      agendaRoots,
      governanceRoots,

      problemNodeIDs,
      actorNodeIDs,
      typeNodeIDs,
      themeNodeIDs,
      normNodeIDs,
      evidenceNodeIDs,
      qualityNodeIDs,
      responsibilityNodeIDs,
      theoryNodeIDs,
      teleologyNodeIDs,
      controlNodeIDs,
      transparencyNodeIDs,
      riskNodeIDs,
      pluralityNodeIDs,
      capacityNodeIDs

    }

  );


})


.catch(error => {

  const status =
    document.getElementById("status");

  if (status) {

    status.innerHTML =
      "<strong>Error:</strong> "
      + error.message;

  }

  console.error(error);

});


/* =========================================================
   GRAFO
   ========================================================= */

function drawGraph(

  nodes,
  hierarchyLinks,
  relatedLinks,
  nodesMap,
  structure

) {


  const {

    eticaNode,
    atencionNode,
    valoresNode,
    agendaNode,
    racionalidadNode,
    gobernanzaNode,

    complianceNode,
    engagementNode,
    accountabilityNode,

    agendaRoots,
    governanceRoots,

    problemNodeIDs,
    actorNodeIDs,
    typeNodeIDs,
    themeNodeIDs,
    normNodeIDs,
    evidenceNodeIDs,
    qualityNodeIDs,
    responsibilityNodeIDs,
    theoryNodeIDs,
    teleologyNodeIDs,
    controlNodeIDs,
    transparencyNodeIDs,
    riskNodeIDs,
    pluralityNodeIDs,
    capacityNodeIDs

  } = structure;


  const container =
    document.getElementById("graph");


  const width =
    container.clientWidth;


  const height =
    container.clientHeight;


  /* =====================================================
     COLORES SEMÁNTICOS
     ===================================================== */

  const COLORS = {

    actors:
      "#cfe3f4",

    actorsStroke:
      "#759bb8",

    problems:
      "#f4b6b6",

    problemsStroke:
      "#b76e6e",

    type:
      "#f7e7a9",

    themes:
      "#d7ead3",

    norms:
      "#e4d7f1",

    evidence:
      "#d5e9f6",

    quality:
      "#d2ece7",

    responsibility:
      "#f5ddc5",

    theory:
      "#e5ddf2",

    teleology:
      "#f3dce6",

    control:
      "#d5ebe5",

    transparency:
      "#f6dfcf",

    risk:
      "#eee5cf",

    plurality:
      "#eadcf0",

    capacity:
      "#dcebd5",

    default:
      "#e4e8ec"

  };


  /* =====================================================
     NODOS TRANSPARENTES

     Ética institucional
     Atención
     Gobernanza
     Racionalidad
     Valores
     Agenda
     Compliance
     Engagement
     Accountability
     ===================================================== */

  const transparentIDs =
    new Set(

      [

        eticaNode,
        atencionNode,
        gobernanzaNode,
        racionalidadNode,

        valoresNode,
        agendaNode,

        complianceNode,
        engagementNode,
        accountabilityNode

      ]

      .filter(Boolean)

      .map(node => node.id)

    );


  const agendaRootIDs =
    new Set(
      agendaRoots.map(
        node => node.id
      )
    );


  const governanceRootIDs =
    new Set(
      governanceRoots.map(
        node => node.id
      )
    );


  /* =====================================================
     FUNCIONES DE JERARQUÍA
     ===================================================== */

  function isDescendantOf(
    node,
    ancestor
  ) {

    if (!node || !ancestor) {
      return false;
    }

    let current = node;

    const visited =
      new Set();

    while (
      current &&
      current.broader &&
      !visited.has(current.id)
    ) {

      visited.add(current.id);

      if (
        current.broader === ancestor.id
      ) {
        return true;
      }

      current =
        nodesMap.get(
          current.broader
        );

    }

    return false;

  }


  /* =====================================================
     POSICIONES INICIALES

     El objetivo es que el grafo nazca ya organizado
     antes de que actúe la simulación.
     ===================================================== */

  const cx =
    width / 2;

  const cy =
    height / 2;


  /* Centro */

  eticaNode.x =
    cx;

  eticaNode.y =
    cy;


  /* Tres grandes ramas */

  atencionNode.x =
    cx - 270;

  atencionNode.y =
    cy - 30;


  racionalidadNode.x =
    cx;

  racionalidadNode.y =
    cy - 260;


  gobernanzaNode.x =
    cx + 270;

  gobernanzaNode.y =
    cy - 30;


  /* Atención */

  valoresNode.x =
    cx - 390;

  valoresNode.y =
    cy + 130;


  agendaNode.x =
    cx - 200;

  agendaNode.y =
    cy + 180;


  /* Gobernanza */

  if (complianceNode) {

    complianceNode.x =
      cx + 160;

    complianceNode.y =
      cy + 170;

  }


  if (engagementNode) {

    engagementNode.x =
      cx + 290;

    engagementNode.y =
      cy + 190;

  }


  if (accountabilityNode) {

    accountabilityNode.x =
      cx + 420;

    accountabilityNode.y =
      cy + 150;

  }


  /*
     Distribución inicial de las seis dimensiones
     de Agenda.
  */

  const agendaAngles = [

    Math.PI * 0.55,
    Math.PI * 0.75,
    Math.PI * 0.95,
    Math.PI * 1.15,
    Math.PI * 1.35,
    Math.PI * 1.55

  ];


  agendaRoots.forEach(
    (root, i) => {

      const angle =
        agendaAngles[
          i % agendaAngles.length
        ];

      root.x =
        agendaNode.x +
        Math.cos(angle) * 180;

      root.y =
        agendaNode.y +
        Math.sin(angle) * 180;

    }
  );


  /*
     Pequeña dispersión inicial controlada
     para el resto de nodos.
  */

  nodes.forEach(
    (d, i) => {

      if (
        Number.isFinite(d.x) &&
        Number.isFinite(d.y)
      ) {
        return;
      }

      const angle =
        (i / Math.max(1, nodes.length))
        * Math.PI * 2;

      const radius =
        120 +
        (i % 7) * 18;

      d.x =
        cx +
        Math.cos(angle) * radius;

      d.y =
        cy +
        Math.sin(angle) * radius;

    }
  );


  /* =====================================================
     SVG
     ===================================================== */

  const svg =

    d3.select("#graph")

      .append("svg")

      .attr(
        "width",
        "100%"
      )

      .attr(
        "height",
        "100%"
      )

      .attr(

        "viewBox",

        [
          0,
          0,
          width,
          height
        ]

      )

      .attr(
        "preserveAspectRatio",
        "xMidYMid meet"
      );


  /* =====================================================
     ZOOM
     ===================================================== */

  const zoomLayer =
    svg.append("g");


  svg.call(

    d3.zoom()

      .scaleExtent([
        0.12,
        5
      ])

      .on(
        "zoom",
        event => {

          zoomLayer.attr(
            "transform",
            event.transform
          );

        }
      )

  );


  /* =====================================================
     OBJETIVOS ESPACIALES

     Estas fuerzas son deliberadamente suaves.

     No fijan los nodos:
     simplemente ayudan a que cada gran rama permanezca
     aproximadamente en su sector.
     ===================================================== */

  function targetX(d) {

    if (
      d.id === eticaNode.id
    ) {
      return cx;
    }


    if (
      d.id === atencionNode.id
    ) {
      return cx - 260;
    }


    if (
      d.id === racionalidadNode.id
    ) {
      return cx;
    }


    if (
      d.id === gobernanzaNode.id
    ) {
      return cx + 260;
    }


    if (
      d.id === valoresNode.id
    ) {
      return cx - 360;
    }


    if (
      d.id === agendaNode.id
    ) {
      return cx - 190;
    }


    if (
      complianceNode &&
      d.id === complianceNode.id
    ) {
      return cx + 150;
    }


    if (
      engagementNode &&
      d.id === engagementNode.id
    ) {
      return cx + 285;
    }


    if (
      accountabilityNode &&
      d.id === accountabilityNode.id
    ) {
      return cx + 410;
    }


    /*
       Descendientes de Atención
    */

    if (
      isDescendantOf(
        d,
        atencionNode
      )
    ) {
      return cx - 230;
    }


    /*
       Descendientes de Racionalidad
    */

    if (
      isDescendantOf(
        d,
        racionalidadNode
      )
    ) {
      return cx;
    }


    /*
       Descendientes de Gobernanza
    */

    if (
      isDescendantOf(
        d,
        gobernanzaNode
      )
    ) {
      return cx + 250;
    }


    return cx;

  }


  function targetY(d) {

    if (
      d.id === eticaNode.id
    ) {
      return cy;
    }


    if (
      d.id === atencionNode.id
    ) {
      return cy;
    }


    if (
      d.id === racionalidadNode.id
    ) {
      return cy - 250;
    }


    if (
      d.id === gobernanzaNode.id
    ) {
      return cy;
    }


    if (
      d.id === valoresNode.id
    ) {
      return cy + 130;
    }


    if (
      d.id === agendaNode.id
    ) {
      return cy + 170;
    }


    if (
      governanceRootIDs.has(d.id)
    ) {
      return cy + 170;
    }


    if (
      isDescendantOf(
        d,
        racionalidadNode
      )
    ) {
      return cy - 230;
    }


    if (
      isDescendantOf(
        d,
        agendaNode
      )
    ) {
      return cy + 210;
    }


    if (
      isDescendantOf(
        d,
        gobernanzaNode
      )
    ) {
      return cy + 180;
    }


    if (
      isDescendantOf(
        d,
        valoresNode
      )
    ) {
      return cy + 120;
    }


    return cy;

  }


  /* =====================================================
     SIMULACIÓN

     Menos repulsión que antes:
     -700 → -360

     Esto hace el grafo más compacto.
     ===================================================== */

  const simulation =

    d3.forceSimulation(nodes)


      .force(

        "link",

        d3.forceLink(
          hierarchyLinks
        )

        .id(
          d => d.id
        )

        .distance(d => {


          /* Ética y grandes ramas */

          if (
            d.source.id === eticaNode.id ||
            d.target.id === eticaNode.id
          ) {
            return 190;
          }


          /* Atención */

          if (
            d.source.id === atencionNode.id ||
            d.target.id === atencionNode.id
          ) {
            return 135;
          }


          /* Gobernanza */

          if (
            d.source.id === gobernanzaNode.id ||
            d.target.id === gobernanzaNode.id
          ) {
            return 135;
          }


          /* Racionalidad */

          if (
            d.source.id === racionalidadNode.id ||
            d.target.id === racionalidadNode.id
          ) {
            return 115;
          }


          /* Agenda */

          if (
            d.source.id === agendaNode.id ||
            d.target.id === agendaNode.id
          ) {
            return 120;
          }


          /* Valores */

          if (
            d.source.id === valoresNode.id ||
            d.target.id === valoresNode.id
          ) {
            return 105;
          }


          /* Raíces */

          if (
            agendaRootIDs.has(
              d.source.id
            )
            ||
            agendaRootIDs.has(
              d.target.id
            )
            ||
            governanceRootIDs.has(
              d.source.id
            )
            ||
            governanceRootIDs.has(
              d.target.id
            )
          ) {
            return 95;
          }


          return 82;

        })

        .strength(
          0.85
        )

      )


      .force(

        "charge",

        d3.forceManyBody()

          .strength(d => {

            if (
              d.id === eticaNode.id
            ) {
              return -650;
            }

            if (
              transparentIDs.has(d.id)
            ) {
              return -470;
            }

            return -360;

          })

      )


      /*
         Fuerzas direccionales suaves.
         Son las responsables del mayor orden inicial.
      */

      .force(

        "x",

        d3.forceX(
          d => targetX(d)
        )

        .strength(d => {

          if (
            d.id === eticaNode.id
          ) {
            return 0.35;
          }

          if (
            d.id === atencionNode.id ||
            d.id === racionalidadNode.id ||
            d.id === gobernanzaNode.id
          ) {
            return 0.20;
          }

          if (
            transparentIDs.has(d.id)
          ) {
            return 0.09;
          }

          return 0.012;

        })

      )


      .force(

        "y",

        d3.forceY(
          d => targetY(d)
        )

        .strength(d => {

          if (
            d.id === eticaNode.id
          ) {
            return 0.35;
          }

          if (
            d.id === atencionNode.id ||
            d.id === racionalidadNode.id ||
            d.id === gobernanzaNode.id
          ) {
            return 0.20;
          }

          if (
            transparentIDs.has(d.id)
          ) {
            return 0.09;
          }

          return 0.012;

        })

      )


      .force(

        "center",

        d3.forceCenter(
          cx,
          cy
        )

        .strength(
          0.035
        )

      )


      .force(

        "collision",

        d3.forceCollide()

          .radius(d => {


            if (
              d.id === eticaNode.id
            ) {
              return 75;
            }


            if (
              d.id === atencionNode.id ||
              d.id === racionalidadNode.id ||
              d.id === gobernanzaNode.id
            ) {
              return 62;
            }


            if (
              transparentIDs.has(d.id)
            ) {
              return 52;
            }


            if (
              actorNodeIDs.has(d.id)
            ) {
              return 34;
            }


            if (
              problemNodeIDs.has(d.id)
            ) {
              return 32;
            }


            return 31;

          })

          .strength(
            0.85
          )

      );


  /* =====================================================
     RELATED
     ===================================================== */

  const related =

    zoomLayer

      .append("g")

      .selectAll("line")

      .data(relatedLinks)

      .join("line")

      .attr(
        "class",
        "related"
      );


  /* =====================================================
     JERARQUÍA
     ===================================================== */

  const links =

    zoomLayer

      .append("g")

      .selectAll("line")

      .data(hierarchyLinks)

      .join("line")

      .attr(
        "class",
        "link"
      );


  /* =====================================================
     NODOS
     ===================================================== */

  const node =

    zoomLayer

      .append("g")

      .selectAll("g")

      .data(nodes)

      .join("g")

      .attr(
        "class",
        "node"
      )

      .call(
        drag(simulation)
      );


  /* =====================================================
     COLOR DE CADA NODO

     Prioridad:

     1. Transparente
     2. Actores
     3. Problemas
     4. Tipo
     5. categorías semánticas
     ===================================================== */

  function nodeColor(d) {


    if (
      transparentIDs.has(d.id)
    ) {
      return "transparent";
    }


    /*
       Actores domina sobre cualquier otra categoría.
    */

    if (
      actorNodeIDs.has(d.id)
    ) {
      return COLORS.actors;
    }


    if (
      problemNodeIDs.has(d.id)
    ) {
      return COLORS.problems;
    }


    /*
       Tipo tiene prioridad alta para que todos los
       Tipo/Tipos se reconozcan visualmente.
    */

    if (
      typeNodeIDs.has(d.id)
    ) {
      return COLORS.type;
    }


    if (
      normNodeIDs.has(d.id)
    ) {
      return COLORS.norms;
    }


    if (
      evidenceNodeIDs.has(d.id)
    ) {
      return COLORS.evidence;
    }


    if (
      qualityNodeIDs.has(d.id)
    ) {
      return COLORS.quality;
    }


    if (
      responsibilityNodeIDs.has(d.id)
    ) {
      return COLORS.responsibility;
    }


    if (
      theoryNodeIDs.has(d.id)
    ) {
      return COLORS.theory;
    }


    if (
      teleologyNodeIDs.has(d.id)
    ) {
      return COLORS.teleology;
    }


    if (
      controlNodeIDs.has(d.id)
    ) {
      return COLORS.control;
    }


    if (
      transparencyNodeIDs.has(d.id)
    ) {
      return COLORS.transparency;
    }


    if (
      riskNodeIDs.has(d.id)
    ) {
      return COLORS.risk;
    }


    if (
      pluralityNodeIDs.has(d.id)
    ) {
      return COLORS.plurality;
    }


    if (
      capacityNodeIDs.has(d.id)
    ) {
      return COLORS.capacity;
    }


    if (
      themeNodeIDs.has(d.id)
    ) {
      return COLORS.themes;
    }


    return COLORS.default;

  }


  /* =====================================================
     TAMAÑO
     ===================================================== */

  function nodeRadius(d) {


    /*
       Nodo principal
    */

    if (
      d.id === eticaNode.id
    ) {
      return 38;
    }


    /*
       Tres grandes nodos estructurales
    */

    if (
      d.id === atencionNode.id ||
      d.id === racionalidadNode.id ||
      d.id === gobernanzaNode.id
    ) {
      return 28;
    }


    /*
       Valores y Agenda
    */

    if (
      d.id === valoresNode.id ||
      d.id === agendaNode.id
    ) {
      return 21;
    }


    /*
       Compliance / Engagement / Accountability
    */

    if (
      governanceRootIDs.has(d.id)
    ) {
      return 19;
    }


    /*
       Seis dimensiones de Agenda
    */

    if (
      agendaRootIDs.has(d.id)
    ) {
      return 17;
    }


    return 11;

  }


  /* =====================================================
     CÍRCULOS

     Todo excepto:
     - Problemas
     - Actores
     ===================================================== */

  node

    .filter(
      d =>
        !problemNodeIDs.has(d.id)
        &&
        !actorNodeIDs.has(d.id)
    )

    .append("circle")

    .attr(
      "r",
      d => nodeRadius(d)
    )

    .attr(
      "fill",
      d => nodeColor(d)
    )

    .attr(
      "stroke",
      d => {

        if (
          d.id === eticaNode.id
        ) {
          return "#333";
        }

        if (
          transparentIDs.has(d.id)
        ) {
          return "#555";
        }

        return "#777";

      }
    )

    .attr(
      "stroke-width",
      d => {

        if (
          d.id === eticaNode.id
        ) {
          return 3;
        }

        if (
          d.id === atencionNode.id ||
          d.id === racionalidadNode.id ||
          d.id === gobernanzaNode.id
        ) {
          return 2.4;
        }

        if (
          transparentIDs.has(d.id)
        ) {
          return 2;
        }

        return 1.4;

      }
    );


  /* =====================================================
     ACTORES

     Todos los Actores y todos sus descendientes
     son cuadrados azul pastel.
     ===================================================== */

  node

    .filter(
      d =>
        actorNodeIDs.has(d.id)
    )

    .append("rect")

    .attr(
      "x",
      -12
    )

    .attr(
      "y",
      -12
    )

    .attr(
      "width",
      24
    )

    .attr(
      "height",
      24
    )

    .attr(
      "rx",
      2
    )

    .attr(
      "fill",
      COLORS.actors
    )

    .attr(
      "stroke",
      COLORS.actorsStroke
    )

    .attr(
      "stroke-width",
      1.5
    );


  /* =====================================================
     PROBLEMAS

     Todos los Problemas y sus descendientes
     son triángulos rojo pastel.
     ===================================================== */

  node

    .filter(
      d =>
        problemNodeIDs.has(d.id)
        &&
        !actorNodeIDs.has(d.id)
    )

    .append("polygon")

    .attr(
      "points",
      "0,-14 13,10 -13,10"
    )

    .attr(
      "fill",
      COLORS.problems
    )

    .attr(
      "stroke",
      COLORS.problemsStroke
    )

    .attr(
      "stroke-width",
      1.5
    );


  /* =====================================================
     ETIQUETAS
     ===================================================== */

  node

    .append("text")

    .attr(
      "x",
      d => {


        if (
          actorNodeIDs.has(d.id)
        ) {
          return 18;
        }


        if (
          problemNodeIDs.has(d.id)
        ) {
          return 18;
        }


        if (
          d.id === eticaNode.id
        ) {
          return 47;
        }


        if (
          d.id === atencionNode.id ||
          d.id === racionalidadNode.id ||
          d.id === gobernanzaNode.id
        ) {
          return 36;
        }


        if (
          d.id === valoresNode.id ||
          d.id === agendaNode.id
        ) {
          return 28;
        }


        if (
          governanceRootIDs.has(d.id)
        ) {
          return 26;
        }


        if (
          agendaRootIDs.has(d.id)
        ) {
          return 23;
        }


        return 16;

      }
    )

    .attr(
      "y",
      4
    )

    .style(
      "font-weight",
      d => {


        if (
          d.id === eticaNode.id
        ) {
          return "700";
        }


        if (
          d.id === atencionNode.id ||
          d.id === racionalidadNode.id ||
          d.id === gobernanzaNode.id
        ) {
          return "700";
        }


        if (
          transparentIDs.has(d.id)
        ) {
          return "600";
        }


        return "normal";

      }
    )

    .style(
      "font-size",
      d => {


        if (
          d.id === eticaNode.id
        ) {
          return "17px";
        }


        if (
          d.id === atencionNode.id ||
          d.id === racionalidadNode.id ||
          d.id === gobernanzaNode.id
        ) {
          return "15px";
        }


        if (
          d.id === valoresNode.id ||
          d.id === agendaNode.id
        ) {
          return "14px";
        }


        return null;

      }
    )

    .text(
      d => d.label
    );


  /* =====================================================
     CLICK
     ===================================================== */

  node.on(

    "click",

    (event, d) => {

      event.stopPropagation();

      showPanel(
        d,
        nodesMap
      );

    }

  );


  /* =====================================================
     ACTUALIZACIÓN
     ===================================================== */

  simulation.on(

    "tick",

    () => {


      links

        .attr(
          "x1",
          d => d.source.x
        )

        .attr(
          "y1",
          d => d.source.y
        )

        .attr(
          "x2",
          d => d.target.x
        )

        .attr(
          "y2",
          d => d.target.y
        );


      related

        .attr(

          "x1",

          d =>

            typeof d.source === "object"

              ? d.source.x

              : nodesMap.get(
                  d.source
                )?.x

        )

        .attr(

          "y1",

          d =>

            typeof d.source === "object"

              ? d.source.y

              : nodesMap.get(
                  d.source
                )?.y

        )

        .attr(

          "x2",

          d =>

            typeof d.target === "object"

              ? d.target.x

              : nodesMap.get(
                  d.target
                )?.x

        )

        .attr(

          "y2",

          d =>

            typeof d.target === "object"

              ? d.target.y

              : nodesMap.get(
                  d.target
                )?.y

        );


      node.attr(

        "transform",

        d =>
          `translate(${d.x},${d.y})`

      );

    }

  );


  /* =====================================================
     RESPONSIVE
     ===================================================== */

  window.addEventListener(

    "resize",

    () => {


      const newWidth =
        container.clientWidth;


      const newHeight =
        container.clientHeight;


      svg.attr(

        "viewBox",

        [
          0,
          0,
          newWidth,
          newHeight
        ]

      );


      /*
         El centro se actualiza al cambiar el tamaño.
      */

      simulation.force(

        "center",

        d3.forceCenter(
          newWidth / 2,
          newHeight / 2
        )

        .strength(
          0.035
        )

      );


      simulation

        .alpha(0.25)

        .restart();

    }

  );

}


/* =========================================================
   PANEL DE INFORMACIÓN
   ========================================================= */

function showPanel(

  concept,
  nodesMap

) {


  const panel =

    document.getElementById(
      "panel"
    );


  const broader =

    concept.broader

    &&

    nodesMap.get(
      concept.broader
    )

      ? nodesMap.get(
          concept.broader
        ).label

      : "—";


  const related =

    concept.related

      .map(

        uri =>
          nodesMap.get(uri)?.label

      )

      .filter(Boolean);


  panel.innerHTML = `

    <h2>${concept.label}</h2>


    <div class="label">
      Etiqueta preferida
    </div>

    <div>
      ${concept.label}
    </div>


    <div class="label">
      Definición
    </div>

    <div>

      ${
        concept.definition

          ? concept.definition

          : "—"
      }

    </div>


    <div class="label">
      Etiquetas alternativas
    </div>

    <div>

      ${
        concept.altLabels.length

          ? concept.altLabels.join(", ")

          : "—"
      }

    </div>


    <div class="label">
      Concepto superior
    </div>

    <div>
      ${broader}
    </div>


    <div class="label">
      Conceptos relacionados
    </div>

    <div>

      ${
        related.length

          ? related.join(", ")

          : "—"
      }

    </div>

  `;

}


/* =========================================================
   ARRASTRE DE NODOS
   ========================================================= */

function drag(simulation) {


  function dragstarted(
    event,
    d
  ) {


    if (!event.active) {

      simulation

        .alphaTarget(0.18)

        .restart();

    }


    d.fx = d.x;
    d.fy = d.y;

  }


  function dragged(
    event,
    d
  ) {

    d.fx = event.x;
    d.fy = event.y;

  }


  function dragended(
    event,
    d
  ) {


    if (!event.active) {

      simulation

        .alphaTarget(0);

    }


    /*
       Al soltar el nodo vuelve a quedar sujeto
       a las fuerzas del grafo.
    */

    d.fx = null;
    d.fy = null;

  }


  return d3.drag()

    .on(
      "start",
      dragstarted
    )

    .on(
      "drag",
      dragged
    )

    .on(
      "end",
      dragended
    );

}

</script>

</body>
