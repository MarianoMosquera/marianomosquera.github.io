<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ética Institucional y Transparencia</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #ffffff;
      color: #333333;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 90%;
      max-width: 1050px;
      text-align: center;
      padding: 60px 30px;
    }

    .logos {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 70px;
      margin-bottom: 55px;
    }

    .logo-ucc {
      width: 310px;
      max-width: 40%;
      height: auto;
    }

    .logo-bitss {
      width: 390px;
      max-width: 48%;
      height: auto;
    }

    .divider {
      width: 70px;
      height: 2px;
      background: #163d78;
      margin: 0 auto 40px auto;
    }

    .description {
      max-width: 820px;
      margin: 0 auto;
      font-size: 20px;
      line-height: 1.7;
      font-weight: 300;
      color: #404040;
    }

    .links {
      margin-top: 45px;
      font-size: 15px;
      letter-spacing: 0.3px;
    }

    .links a {
      color: #164a7b;
      text-decoration: none;
      margin: 0 15px;
    }

    .links a:hover {
      text-decoration: underline;
    }

    @media (max-width: 700px) {
      .container {
        padding: 40px 20px;
      }

      .logos {
        flex-direction: column;
        gap: 35px;
        margin-bottom: 40px;
      }

      .logo-ucc,
      .logo-bitss {
        width: 75%;
        max-width: 350px;
      }

      .description {
        font-size: 17px;
        line-height: 1.6;
      }

      .links a {
        display: block;
        margin: 12px 0;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="logos">
      <img src="images/UCC_logo.png"
           alt="Universidad Católica de Córdoba"
           class="logo-ucc">

      <img src="images/BITSS_logo.png"
           alt="Berkeley Initiative for Transparency in the Social Sciences"
           class="logo-bitss">
    </div>

    <div class="divider"></div>

    <p class="description">
      Proyecto de la Universidad Católica de Córdoba, con el apoyo de la
      Iniciativa de Transparencia en Ciencias Sociales de la Universidad de
      Berkeley. Tiene como objetivo promover marcos de referencia en materia
      de ética institucional y transparencia.
    </p>

    <div class="links">
      <a href="https://tr4nsp4renci4.com" target="_blank" rel="noopener">
        tr4nsp4renci4.com
      </a>

      <a href="https://www.marianomosquera.com" target="_blank" rel="noopener">
        marianomosquera.com
      </a>
    </div>

  </main>

</body>
</html>
