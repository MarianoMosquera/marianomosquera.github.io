.back{display:inline-block;margin:30px 0 0;color:var(--muted);text-decoration:none;font-size:12px;letter-spacing:.08em;text-transform:uppercase;transition:color .2s ease}
.back:hover{color:var(--ink)}
header{margin-top:22px;padding:74px 0 76px;border-top:1px solid var(--ink);border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1.2fr) minmax(280px,.8fr);gap:72px;align-items:end}
header:before{content:"MARIANO MOSQUERA  / ";grid-column:1/-1;font-size:11px;letter-spacing:.18em;font-weight:700;color:var(--muted);margin-bottom:-34px}
h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:clamp(58px,8vw,108px);line-height:.88;letter-spacing:-.055em;font-weight:400}
.lead{max-width:500px;margin:0 0 5px;font-size:18px;line-height:1.62;color:#383838}
.conference-counter{padding:92px 0 96px;border-bottom:1px solid var(--line);overflow:hidden}
.conference-counter__number{display:block;margin:0;font-family:Georgia,"Times New Roman",serif;font-size:clamp(210px,31vw,460px);line-height:.72;letter-spacing:-.085em;font-weight:400;font-variant-numeric:tabular-nums lining-nums;transform-origin:left bottom;will-change:transform,opacity}
.conference-counter__label{display:block;margin-top:42px;font-size:13px;line-height:1;letter-spacing:.24em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.conference-counter.is-complete .conference-counter__number{animation:counter-settle .72s cubic-bezier(.16,1,.3,1) both}
@keyframes counter-settle{
  0%{transform:translateY(7px) scale(.985);opacity:.86}
  58%{transform:translateY(-2px) scale(1.008);opacity:1}
  100%{transform:translateY(0) scale(1);opacity:1}
}
.records{margin-top:72px;border-top:1px solid var(--ink)}
.record{padding:28px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:120px minmax(0,1fr);gap:32px}
.record h2{margin:0 0 9px;font-family:Georgia,"Times New Roman",serif;font-size:22px;line-height:1.25;font-weight:400;letter-spacing:-.015em}
.record p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}
.sources{margin-top:10px;font-size:12px;letter-spacing:.01em}
.sources a{color:var(--ink);text-decoration-color:#aaa;text-underline-offset:4px}
.sources a:hover{text-decoration-color:var(--ink)}
@media(max-width:760px){
 main{width:min(100% - 32px,1180px);padding-bottom:72px}
 .back{margin-top:22px}
 header{margin-top:18px;padding:52px 0 48px;grid-template-columns:1fr;gap:28px}
 header:before{margin-bottom:-8px}
 h1{font-size:clamp(50px,16vw,78px)}
 .lead{font-size:17px;max-width:620px}
 .conference-counter{padding:68px 0 72px}
 .conference-counter__number{font-size:clamp(150px,48vw,260px);line-height:.74}
 .conference-counter__label{margin-top:30px;font-size:11px;letter-spacing:.2em}
 .record{grid-template-columns:1fr;gap:10px;padding:23px 0}
}
</style>
</head>
<body>
<main>
<a class="back" href="/bio/" aria-label="Regresar a la biografía de Mariano Mosquera">← bio</a>
<header>
<h1>Conferencias</h1>
<p class="lead">Conferencista en congresos internacionales y especializados en ética, transparencia y anticorrupción.</p>
</header>
<section class="conference-counter" aria-label="81 conferencias">
<span class="conference-counter__number" id="conference-count" aria-hidden="true">0</span>
<span class="conference-counter__label">Conferencias</span>
</section>

</main>
<script>
(() => {
  const counter = document.getElementById("conference-count");
  const block = counter.closest(".conference-counter");
  const target = 81;
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  if (reduceMotion) {
    counter.textContent = target;
    block.classList.add("is-complete");
    return;
  }

  const duration = 2400;
  const pause = 180;
  const easeOutExpo = t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t);
  let start = null;
  let lastValue = -1;

  const animate = timestamp => {
    if (start === null) start = timestamp + pause;
    if (timestamp < start) {
      requestAnimationFrame(animate);
      return;
    }

    const progress = Math.min((timestamp - start) / duration, 1);
    const eased = easeOutExpo(progress);
    const value = Math.min(target, Math.floor(eased * (target + 1)));

    if (value !== lastValue) {
      counter.textContent = value;
      lastValue = value;
    }

    if (progress < 1) {
      requestAnimationFrame(animate);
    } else {
      counter.textContent = target;
      block.classList.add("is-complete");
    }
  };

  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
