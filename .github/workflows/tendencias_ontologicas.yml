name: Tendencias ontologicas

on:
  workflow_dispatch:
    inputs:
      cantidad:
        description: "Cantidad de abstracts (0 = corpus completo)"
        required: true
        default: "2"
        type: choice
        options:
          - "2"
          - "5"
          - "0"

permissions:
  contents: read

jobs:
  analizar:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install -r orquestador/orquestador_tendencias/requirements.txt

      - name: Ejecutar motor semantico
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -m orquestador.orquestador_tendencias.motor \
            --limit "${{ inputs.cantidad }}" \
            --out resultados_tendencias

      - name: Descargar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-tendencias
          path: resultados_tendencias/
          if-no-files-found: warn
